github.list_repos:
  type: rest
  description: List repositories for a user
  base_url: "https://api.github.com"
  method: GET
  path: "/users/{{username}}/repos"
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: factorly
  auth:
    type: bearer
    token: "{{vault:GITHUB_TOKEN}}"
  parameters:
    - name: username
      description: GitHub username
      required: true
      in: path
    - name: sort
      description: "Sort field (created, updated, pushed, full_name)"
      in: query
    - name: per_page
      description: Results per page (max 100)
      in: query

github.get_repo:
  type: rest
  description: Get repository details
  base_url: "https://api.github.com"
  method: GET
  path: "/repos/{{owner}}/{{repo}}"
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: factorly
  auth:
    type: bearer
    token: "{{vault:GITHUB_TOKEN}}"
  parameters:
    - name: owner
      description: Repository owner
      required: true
      in: path
    - name: repo
      description: Repository name
      required: true
      in: path

github.list_issues:
  type: rest
  description: List issues for a repository
  base_url: "https://api.github.com"
  method: GET
  path: "/repos/{{owner}}/{{repo}}/issues"
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: factorly
  auth:
    type: bearer
    token: "{{vault:GITHUB_TOKEN}}"
  parameters:
    - name: owner
      description: Repository owner
      required: true
      in: path
    - name: repo
      description: Repository name
      required: true
      in: path
    - name: state
      description: "State filter (open, closed, all)"
      in: query
    - name: labels
      description: "Comma-separated label names"
      in: query

github.create_issue:
  type: rest
  description: Create an issue
  base_url: "https://api.github.com"
  method: POST
  path: "/repos/{{owner}}/{{repo}}/issues"
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: factorly
  auth:
    type: bearer
    token: "{{vault:GITHUB_TOKEN}}"
  parameters:
    - name: owner
      description: Repository owner
      required: true
      in: path
    - name: repo
      description: Repository name
      required: true
      in: path
    - name: title
      description: Issue title
      required: true
      in: body
    - name: body
      description: Issue body (markdown)
      in: body
  shadow:
    confirm: true

github.list_prs:

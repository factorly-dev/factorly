github.get_user:
  type: rest
  description: "Get the authenticated user's profile"
  base_url: "https://api.github.com"
  method: GET
  path: /user
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: factorly
  auth:
    type: bearer
    token: "{{vault:GITHUB_TOKEN}}"

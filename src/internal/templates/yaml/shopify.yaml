shopify.list_orders:
  type: rest
  description: List orders
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: GET
  path: /orders.json
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: limit
      description: "Number of results (1-250)"
      in: query
    - name: status
      description: "Filter by status (open, closed, cancelled, any)"
      in: query
    - name: since_id
      description: Show orders after this ID
      in: query

shopify.list_products:
  type: rest
  description: List products
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: GET
  path: /products.json
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: limit
      description: "Number of results (1-250)"
      in: query
    - name: since_id
      description: Show products after this ID
      in: query
    - name: title
      description: Filter by title
      in: query

shopify.get_order:
  type: rest
  description: Get an order by ID
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: GET
  path: "/orders/{order_id}.json"
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: order_id
      description: Order ID
      required: true
      in: path

shopify.list_customers:
  type: rest
  description: List customers
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: GET
  path: /customers.json
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: limit
      description: "Number of results (1-250)"
      in: query
    - name: since_id
      description: Show customers after this ID
      in: query

shopify.create_product:
  type: rest
  description: Create a new product
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: POST
  path: /products.json
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: product
      description: "Product object with title, body_html, vendor, etc."
      required: true
      in: body
  shadow:
    confirm: true

shopify.update_inventory:
  type: rest
  description: Set inventory level for an item
  base_url: "https://YOUR_STORE.myshopify.com/admin/api/2024-01"
  method: POST
  path: /inventory_levels/set.json
  auth:
    type: bearer
    token: "{{vault:SHOPIFY_ACCESS_TOKEN}}"
  parameters:
    - name: inventory_item_id
      description: Inventory item ID
      required: true
      in: body
    - name: location_id
      description: Location ID
      required: true
      in: body
    - name: available
      description: Available quantity
      required: true
      in: body
  shadow:
    confirm: true

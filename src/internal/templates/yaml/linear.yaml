linear.list_issues:
  type: rest
  description: List issues assigned to you
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"
  parameters:
    - name: query
      description: "GraphQL query (default: viewer's issues)"
      in: body

linear.get_issue:
  type: rest
  description: Get issue details by identifier
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"
  parameters:
    - name: id
      description: "Issue identifier (e.g., ENG-123)"
      required: true
      in: body

linear.create_issue:
  type: rest
  description: Create a new issue
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"
  parameters:
    - name: title
      description: Issue title
      required: true
      in: body
    - name: teamId
      description: Team ID
      required: true
      in: body
    - name: description
      description: Issue description (markdown)
      in: body
    - name: priority
      description: "Priority (0-4)"
      in: body
  shadow:
    confirm: true

linear.update_issue:
  type: rest
  description: Update an existing issue
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"
  parameters:
    - name: id
      description: Issue ID
      required: true
      in: body
    - name: title
      description: New title
      in: body
    - name: state
      description: New state
      in: body
    - name: assigneeId
      description: Assignee user ID
      in: body
  shadow:
    confirm: true

linear.search:
  type: rest
  description: "Search issues, projects, and documents"
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"
  parameters:
    - name: query
      description: Search query string
      required: true
      in: body

linear.list_teams:
  type: rest
  description: List all teams in the workspace
  base_url: "https://api.linear.app"
  method: POST
  path: /graphql
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:LINEAR_API_KEY}}"

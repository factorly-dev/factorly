onedrive.list_files:
  type: rest
  description: List files in a folder
  base_url: "https://graph.microsoft.com/v1.0"
  method: GET
  path: /me/drive/root/children
  auth:
    type: oauth
    provider: onedrive
  parameters:
    - name: $top
      description: Number of results
      in: query
    - name: $orderby
      description: Sort order
      in: query

onedrive.get_file:
  type: rest
  description: Get file metadata by ID
  base_url: "https://graph.microsoft.com/v1.0"
  method: GET
  path: "/me/drive/items/{item_id}"
  auth:
    type: oauth
    provider: onedrive
  parameters:
    - name: item_id
      description: Drive item ID
      required: true
      in: path

onedrive.search:
  type: rest
  description: Search for files
  base_url: "https://graph.microsoft.com/v1.0"
  method: GET
  path: "/me/drive/root/search(q='{query}')"
  auth:
    type: oauth
    provider: onedrive
  parameters:
    - name: query
      description: Search query string
      required: true
      in: path
    - name: $top
      description: Number of results
      in: query

onedrive.create_folder:
  type: rest
  description: Create a new folder
  base_url: "https://graph.microsoft.com/v1.0"
  method: POST
  path: /me/drive/root/children
  auth:
    type: oauth
    provider: onedrive
  parameters:
    - name: name
      description: Folder name
      required: true
      in: body
    - name: folder
      description: Parent folder path or ID
      required: true
      in: body
  shadow:
    confirm: true

onedrive.upload_file:
  type: rest
  description: Upload a small file (up to 4MB)
  base_url: "https://graph.microsoft.com/v1.0"
  method: PUT
  path: "/me/drive/root:/{filename}:/content"
  auth:
    type: oauth
    provider: onedrive
  parameters:
    - name: filename
      description: File path and name
      required: true
      in: path
    - name: body
      description: File content
      required: true
      in: body
  shadow:
    confirm: true

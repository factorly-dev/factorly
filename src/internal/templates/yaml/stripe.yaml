stripe.list_customers:
  type: rest
  description: List customers
  base_url: "https://api.stripe.com"
  method: GET
  path: /v1/customers
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: limit
      description: "Number of results (1-100)"
      in: query
    - name: email
      description: Filter by email address
      in: query

stripe.create_customer:
  type: rest
  description: Create a new customer
  base_url: "https://api.stripe.com"
  method: POST
  path: /v1/customers
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: email
      description: Customer email
      required: true
      in: body
    - name: name
      description: Customer name
      in: body
    - name: description
      description: Customer description
      in: body
  shadow:
    confirm: true

stripe.list_charges:
  type: rest
  description: List charges
  base_url: "https://api.stripe.com"
  method: GET
  path: /v1/charges
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: limit
      description: "Number of results (1-100)"
      in: query
    - name: customer
      description: Filter by customer ID
      in: query

stripe.list_invoices:
  type: rest
  description: List invoices
  base_url: "https://api.stripe.com"
  method: GET
  path: /v1/invoices
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: limit
      description: "Number of results (1-100)"
      in: query
    - name: customer
      description: Filter by customer ID
      in: query
    - name: status
      description: "Filter by status (draft, open, paid, void, uncollectible)"
      in: query

stripe.list_subscriptions:
  type: rest
  description: List subscriptions
  base_url: "https://api.stripe.com"
  method: GET
  path: /v1/subscriptions
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: limit
      description: "Number of results (1-100)"
      in: query
    - name: customer
      description: Filter by customer ID
      in: query
    - name: status
      description: "Filter by status (active, past_due, canceled, etc.)"
      in: query

stripe.create_invoice:
  type: rest
  description: Create an invoice
  base_url: "https://api.stripe.com"
  method: POST
  path: /v1/invoices
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: customer
      description: Customer ID
      required: true
      in: body
    - name: auto_advance
      description: "Auto-finalize the invoice (true/false)"
      in: body
  shadow:
    confirm: true

stripe.refund_charge:
  type: rest
  description: Refund a charge
  base_url: "https://api.stripe.com"
  method: POST
  path: /v1/refunds
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"
  parameters:
    - name: charge
      description: Charge ID to refund
      required: true
      in: body
    - name: amount
      description: Amount in cents (partial refund)
      in: body
  shadow:
    confirm: true

stripe.get_balance:
  type: rest
  description: Get account balance
  base_url: "https://api.stripe.com"
  method: GET
  path: /v1/balance
  auth:
    type: bearer
    token: "{{vault:STRIPE_SECRET_KEY}}"

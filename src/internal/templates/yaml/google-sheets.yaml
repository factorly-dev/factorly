google-sheets.get_spreadsheet:
  type: rest
  description: Get spreadsheet metadata and sheets
  base_url: "https://sheets.googleapis.com"
  method: GET
  path: "/v4/spreadsheets/{{spreadsheetId}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: spreadsheetId
      description: The spreadsheet ID
      required: true
      in: path
    - name: includeGridData
      description: True to include grid data
      in: query

google-sheets.get_values:
  type: rest
  description: Get values from a spreadsheet range
  base_url: "https://sheets.googleapis.com"
  method: GET
  path: "/v4/spreadsheets/{{spreadsheetId}}/values/{{range}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: spreadsheetId
      description: The spreadsheet ID
      required: true
      in: path
    - name: range
      description: "A1 notation range (e.g. Sheet1!A1:D5)"
      required: true
      in: path
    - name: majorDimension
      description: Major dimension (ROWS or COLUMNS)
      in: query
    - name: valueRenderOption
      description: "How values are rendered (FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA)"
      in: query

google-sheets.update_values:
  type: rest
  description: Update values in a spreadsheet range
  base_url: "https://sheets.googleapis.com"
  method: PUT
  path: "/v4/spreadsheets/{{spreadsheetId}}/values/{{range}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: spreadsheetId
      description: The spreadsheet ID
      required: true
      in: path
    - name: range
      description: "A1 notation range (e.g. Sheet1!A1:D5)"
      required: true
      in: path
    - name: valueInputOption
      description: How input is interpreted (RAW or USER_ENTERED)
      required: true
      in: query
    - name: values
      description: 2D array of values to write
      required: true
      in: body
  shadow:
    confirm: true

google-sheets.append_values:
  type: rest
  description: Append values to a spreadsheet range
  base_url: "https://sheets.googleapis.com"
  method: POST
  path: "/v4/spreadsheets/{{spreadsheetId}}/values/{{range}}:append"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: spreadsheetId
      description: The spreadsheet ID
      required: true
      in: path
    - name: range
      description: A1 notation range to search for a table
      required: true
      in: path
    - name: valueInputOption
      description: How input is interpreted (RAW or USER_ENTERED)
      required: true
      in: query
    - name: insertDataOption
      description: How input data is inserted (OVERWRITE or INSERT_ROWS)
      in: query
    - name: values
      description: 2D array of values to append
      required: true
      in: body
  shadow:
    confirm: true

google-sheets.create_spreadsheet:
  type: rest
  description: Create a new spreadsheet
  base_url: "https://sheets.googleapis.com"
  method: POST
  path: /v4/spreadsheets
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: title
      description: Title for the new spreadsheet
      required: true
      in: body
  shadow:
    confirm: true

google-sheets.clear_values:
  type: rest
  description: Clear values from a spreadsheet range
  base_url: "https://sheets.googleapis.com"
  method: POST
  path: "/v4/spreadsheets/{{spreadsheetId}}/values/{{range}}:clear"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-sheets
  parameters:
    - name: spreadsheetId
      description: The spreadsheet ID
      required: true
      in: path
    - name: range
      description: A1 notation range to clear
      required: true
      in: path
  shadow:
    confirm: true

google-docs.get_document:
  type: rest
  description: Get the content and metadata of a document
  base_url: "https://docs.googleapis.com/v1"
  method: GET
  path: "/documents/{{documentId}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-docs
  parameters:
    - name: documentId
      description: The document ID
      required: true
      in: path

google-docs.create_document:
  type: rest
  description: Create a new Google Docs document
  base_url: "https://docs.googleapis.com/v1"
  method: POST
  path: /documents
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-docs
  parameters:
    - name: title
      description: Document title
      required: true
      in: body
  shadow:
    confirm: true

google-docs.batch_update:
  type: rest
  description: Apply a batch of updates to a document
  base_url: "https://docs.googleapis.com/v1"
  method: POST
  path: "/documents/{{documentId}}:batchUpdate"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-docs
  parameters:
    - name: documentId
      description: The document ID
      required: true
      in: path
    - name: requests
      description: Array of update request objects
      required: true
      in: body
  shadow:
    confirm: true

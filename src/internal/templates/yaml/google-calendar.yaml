google-calendar.list_events:
  type: rest
  description: List events on a calendar
  base_url: "https://www.googleapis.com/calendar/v3"
  method: GET
  path: "/calendars/{{calendarId}}/events"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: calendarId
      description: "Calendar ID (use 'primary' for the main calendar)"
      required: true
      in: path
    - name: timeMin
      description: Lower bound for event start time (RFC3339 timestamp)
      in: query
    - name: timeMax
      description: Upper bound for event start time (RFC3339 timestamp)
      in: query
    - name: maxResults
      description: Maximum number of events to return
      in: query
    - name: singleEvents
      description: Whether to expand recurring events (true/false)
      in: query
    - name: orderBy
      description: Sort order (startTime or updated)
      in: query

google-calendar.create_event:
  type: rest
  description: Create a new calendar event
  base_url: "https://www.googleapis.com/calendar/v3"
  method: POST
  path: "/calendars/{{calendarId}}/events"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: calendarId
      description: "Calendar ID (use 'primary' for the main calendar)"
      required: true
      in: path
    - name: summary
      description: Event title
      required: true
      in: body
    - name: description
      description: Event description
      in: body
    - name: start
      description: Start time object with dateTime and timeZone
      required: true
      in: body
    - name: end
      description: End time object with dateTime and timeZone
      required: true
      in: body
    - name: attendees
      description: Array of attendees with email addresses
      in: body
  shadow:
    confirm: true

google-calendar.get_event:
  type: rest
  description: Get a specific calendar event
  base_url: "https://www.googleapis.com/calendar/v3"
  method: GET
  path: "/calendars/{{calendarId}}/events/{{eventId}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: calendarId
      description: "Calendar ID (use 'primary' for the main calendar)"
      required: true
      in: path
    - name: eventId
      description: Event ID
      required: true
      in: path

google-calendar.update_event:
  type: rest
  description: Update an existing calendar event
  base_url: "https://www.googleapis.com/calendar/v3"
  method: PUT
  path: "/calendars/{{calendarId}}/events/{{eventId}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: calendarId
      description: "Calendar ID (use 'primary' for the main calendar)"
      required: true
      in: path
    - name: eventId
      description: Event ID
      required: true
      in: path
    - name: summary
      description: Event title
      in: body
    - name: description
      description: Event description
      in: body
    - name: start
      description: Start time object with dateTime and timeZone
      in: body
    - name: end
      description: End time object with dateTime and timeZone
      in: body
  shadow:
    confirm: true

google-calendar.delete_event:
  type: rest
  description: Delete a calendar event
  base_url: "https://www.googleapis.com/calendar/v3"
  method: DELETE
  path: "/calendars/{{calendarId}}/events/{{eventId}}"
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: calendarId
      description: "Calendar ID (use 'primary' for the main calendar)"
      required: true
      in: path
    - name: eventId
      description: Event ID
      required: true
      in: path
  shadow:
    confirm: true

google-calendar.list_calendars:
  type: rest
  description: List all calendars for the authenticated user
  base_url: "https://www.googleapis.com/calendar/v3"
  method: GET
  path: /users/me/calendarList
  headers:
    Content-Type: application/json
  auth:
    type: oauth
    provider: google-calendar
  parameters:
    - name: maxResults
      description: Maximum number of calendars to return
      in: query

discord.send_message:
  type: rest
  description: Send a message to a channel
  base_url: "https://discord.com/api/v10"
  method: POST
  path: "/channels/{{channelId}}/messages"
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:DISCORD_BOT_TOKEN}}"
  parameters:
    - name: channelId
      description: The channel ID
      required: true
      in: path
    - name: content
      description: Message content (up to 2000 characters)
      required: true
      in: body
  shadow:
    confirm: true

discord.list_channels:
  type: rest
  description: List channels in a guild
  base_url: "https://discord.com/api/v10"
  method: GET
  path: "/guilds/{{guildId}}/channels"
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:DISCORD_BOT_TOKEN}}"
  parameters:
    - name: guildId
      description: The guild (server) ID
      required: true
      in: path

discord.list_guild_members:
  type: rest
  description: List members of a guild
  base_url: "https://discord.com/api/v10"
  method: GET
  path: "/guilds/{{guildId}}/members"
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:DISCORD_BOT_TOKEN}}"
  parameters:
    - name: guildId
      description: The guild (server) ID
      required: true
      in: path
    - name: limit
      description: "Max number of members to return (1-1000, default 1)"
      in: query
    - name: after
      description: Get members after this user ID
      in: query

discord.create_reaction:
  type: rest
  description: Add a reaction to a message
  base_url: "https://discord.com/api/v10"
  method: PUT
  path: "/channels/{{channelId}}/messages/{{messageId}}/reactions/{{emoji}}/@me"
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:DISCORD_BOT_TOKEN}}"
  parameters:
    - name: channelId
      description: The channel ID
      required: true
      in: path
    - name: messageId
      description: The message ID
      required: true
      in: path
    - name: emoji
      description: "URL-encoded emoji (e.g. %F0%9F%91%8D for thumbs up)"
      required: true
      in: path
  shadow:
    confirm: true

discord.get_channel:
  type: rest
  description: Get a channel by ID
  base_url: "https://discord.com/api/v10"
  method: GET
  path: "/channels/{{channelId}}"
  headers:
    Content-Type: application/json
  auth:
    type: bearer
    token: "{{vault:DISCORD_BOT_TOKEN}}"
  parameters:
    - name: channelId
      description: The channel ID
      required: true
      in: path

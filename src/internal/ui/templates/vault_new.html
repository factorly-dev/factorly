{{define "content"}}
<div class="mb-4">
  <a href="/vault" class="text-xs text-gray-500 hover:text-gray-900">← Back to Vault</a>
</div>

<h1 class="text-2xl font-bold mb-2">Create Vault Secret</h1>
<p class="text-sm text-gray-500 mb-6">
  Store an encrypted secret. The vault must be unlocked for the target tier
  — locked vaults will prompt for a password after submit.
</p>

<form method="POST" action="/vault/new" class="bg-white rounded-lg border border-gray-200 p-5">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-[10px] text-gray-600 uppercase mb-1">Key</label>
      <input type="text" name="key" required autofocus placeholder="API_KEY"
             class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
    </div>
    <div>
      <label class="block text-[10px] text-gray-600 uppercase mb-1">Save in</label>
      <select name="scope" class="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
        {{range .Sections}}
        <option value="{{.Scope}}">{{.Label}}</option>
        {{end}}
      </select>
    </div>
  </div>

  <div class="mb-4">
    <label class="block text-[10px] text-gray-600 uppercase mb-1">Value</label>
    <input type="password" name="value" required placeholder="secret value"
           class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
    <p class="text-[11px] text-gray-600 mt-1">
      The value is stored encrypted; it's masked here to avoid shoulder-surfing.
    </p>
  </div>

  <div class="flex items-center justify-end gap-3">
    <a href="/vault" class="px-3 py-1.5 text-sm text-gray-500 hover:text-gray-700">Cancel</a>
    <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
      Create Secret
    </button>
  </div>
</form>
{{end}}

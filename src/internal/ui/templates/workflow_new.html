{{define "content"}}
<h1 class="text-2xl font-bold mb-6">New Workflow</h1>

<form method="POST" action="/workflows/_new" class="bg-white rounded-lg border border-gray-200 p-6 max-w-2xl">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" name="name" required placeholder="deploy.staging"
             class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
      <p class="text-xs text-gray-600 mt-1">Dot-separated name (e.g., git.commit_prep, deploy.staging)</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea name="description" rows="3" placeholder="What does this workflow do? Markdown is rendered in the read-only view."
                class="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 resize-y"></textarea>
    </div>

    <div class="pt-4">
      <button type="submit"
              class="px-4 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
        Create Workflow
      </button>
    </div>
  </div>
</form>
{{end}}

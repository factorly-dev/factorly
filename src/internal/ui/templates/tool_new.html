{{define "content"}}
<div class="mb-6">
  <a href="/tools" class="text-sm text-gray-500 hover:text-gray-700">← Back to tools</a>
</div>

<h1 class="text-2xl font-bold mb-6">New Tool</h1>

<form method="POST" action="/tools/_new" class="bg-white rounded-lg border border-gray-200 p-6 max-w-2xl">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" name="name" required placeholder="github.list_repos"
             class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
      <p class="text-xs text-gray-400 mt-1">Dot-separated name (e.g., github.list_repos, slack.post_message)</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
      <select name="type" required
              class="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"
              hx-get="/tools/_form"
              hx-target="#type-fields"
              hx-include="[name='type']"
              hx-trigger="change">
        <option value="cli">CLI</option>
        <option value="rest">REST</option>
        <option value="mcp">MCP</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <input type="text" name="description" placeholder="What does this tool do?"
             class="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
    </div>

    <div id="type-fields">
      <!-- CLI fields (default) -->
      <div class="space-y-4 pt-4 border-t border-gray-100">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Command</label>
          <input type="text" name="command" placeholder="curl"
                 class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Args</label>
          <input type="text" name="args" placeholder='-s "{{"{{url}}"}}"'
                 class="w-full px-3 py-2 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200">
          <p class="text-xs text-gray-400 mt-1">Space-separated. Use {{"{{param}}"}} for placeholders.</p>
        </div>
      </div>
    </div>

    <div class="pt-4">
      <button type="submit"
              class="px-4 py-2 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors">
        Create Tool
      </button>
    </div>
  </div>
</form>
{{end}}

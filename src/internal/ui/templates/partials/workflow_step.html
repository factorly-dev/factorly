{{define "workflow_step"}}
<details class="step-row border-b border-gray-100 last:border-b-0" data-index="{{.Index}}" open>
  <summary class="px-4 py-3 flex items-center gap-3 cursor-pointer hover:bg-gray-50 transition-colors">
    <span class="step-num text-[10px] font-bold text-gray-400 w-4 text-right shrink-0">{{inc .Index}}</span>
    <span class="text-sm font-mono text-gray-400 flex-1">new step</span>
    <span class="flex gap-0.5 shrink-0 ml-1">
      <button type="button" onclick="event.preventDefault(); moveStep(this, -1)" class="text-gray-300 hover:text-gray-600 text-[10px] px-0.5" title="Move up">▲</button>
      <button type="button" onclick="event.preventDefault(); moveStep(this, 1)" class="text-gray-300 hover:text-gray-600 text-[10px] px-0.5" title="Move down">▼</button>
    </span>
    <button type="button" onclick="event.preventDefault(); removeStep(this)" class="text-gray-300 hover:text-red-500 text-xs shrink-0">✕</button>
  </summary>
  <div class="px-4 pb-4 pt-1 pl-11 space-y-3 bg-gray-50/50">
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Tool</label>
      <select name="step_tool_{{.Index}}" class="step-tool w-full px-2 py-1.5 text-sm font-mono border border-gray-200 rounded bg-white focus:outline-none focus:ring-1 focus:ring-indigo-200"
              hx-get="/workflows/{{.WorkflowName}}/step-params"
              hx-vals="js:{tool: event.target.value, index: event.target.closest('.step-row').dataset.index}"
              hx-target="#step-params-{{.Index}}"
              hx-swap="innerHTML"
              hx-trigger="change">
        <option value="">Select a tool...</option>
        {{range .AvailableTools}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
    </div>
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Store output as</label>
      <input type="text" name="step_store_{{.Index}}" placeholder="variable name" class="step-store w-full px-2 py-1.5 text-sm font-mono border border-gray-200 rounded bg-white focus:outline-none focus:ring-1 focus:ring-indigo-200">
    </div>
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">If (skip when false)</label>
      <input type="text" name="step_if_{{.Index}}" placeholder="e.g. changes != ''" class="w-full px-2 py-1.5 text-sm font-mono border border-gray-200 rounded bg-white focus:outline-none focus:ring-1 focus:ring-indigo-200">
    </div>
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Require (stop when false)</label>
      <input type="text" name="step_require_{{.Index}}" placeholder="e.g. contains(output, 'PASS')" class="w-full px-2 py-1.5 text-sm font-mono border border-gray-200 rounded bg-white focus:outline-none focus:ring-1 focus:ring-indigo-200">
    </div>
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Params</label>
      <div id="step-params-{{.Index}}" class="space-y-1 step-params" data-index="{{.Index}}"></div>
      <button type="button" onclick="addParam(this)" class="mt-1 inline-flex items-center gap-1 text-[10px] text-indigo-500 hover:text-indigo-700">{{icon "plus"}} param</button>
    </div>
  </div>
</details>
{{end}}

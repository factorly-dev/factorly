{{define "try_panel"}}
<div class="bg-white rounded-lg border border-gray-200 p-5 sticky top-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xs font-medium text-gray-500 uppercase tracking-wide">Try it</h2>
    <span class="text-[10px] text-gray-400 font-mono">{{.Name}}</span>
  </div>

  <form hx-post="/tools/{{.Name}}/try" hx-target="#try-result" hx-swap="innerHTML" hx-indicator="#try-spinner">
    {{if .Params}}
    <div class="space-y-3 mb-4">
      {{range .Params}}
      <div>
        <label class="block text-xs text-gray-600 mb-1 font-medium">
          {{.Name}}
          {{if .Required}}<span class="text-red-400">*</span>{{end}}
          {{if .Type}}<span class="text-gray-300 font-normal">{{.Type}}</span>{{end}}
        </label>
        {{if .Description}}<p class="text-[10px] text-gray-400 mb-1">{{.Description}}</p>{{end}}
        {{if eq .Type "text"}}
        <textarea name="param_{{.Name}}" rows="4"
                  class="w-full px-3 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200"
                  {{if .Required}}required{{end}}>{{.Default}}</textarea>
        {{else}}
        <input type="text" name="param_{{.Name}}" value="{{.Default}}"
               class="w-full px-3 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-200"
               {{if .Required}}required{{end}}>
        {{end}}
      </div>
      {{end}}
    </div>
    {{else}}
    <p class="text-xs text-gray-400 mb-4">No parameters.</p>
    {{end}}

    <button type="submit"
            class="w-full px-4 py-2.5 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors shadow-sm inline-flex items-center justify-center gap-2">
      {{icon "play"}} Run
    </button>
    <span id="try-spinner" class="htmx-indicator block mt-2 text-center text-xs text-gray-400">
      <span class="inline-block animate-pulse">●</span> executing...
    </span>
  </form>

  <div id="try-result" class="mt-4"></div>
</div>
{{end}}

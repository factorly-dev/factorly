{{define "workspace_unlock"}}
<div class="absolute right-0 mt-2 w-72 bg-white border border-gray-200 rounded-lg shadow-lg z-50 p-3" id="ws-dropdown">
  <div class="text-[10px] font-semibold text-gray-600 uppercase tracking-wide mb-2">
    Unlock {{.Name}} vault
  </div>
  <form hx-post="/workspaces/unlock" hx-target="#ws-dropdown" hx-swap="outerHTML" class="space-y-2">
    <input type="hidden" name="name" value="{{.Name}}">
    <input type="password" name="password" required autofocus placeholder="vault password"
           class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm focus:outline-none focus:ring-1 focus:ring-indigo-200">
    {{if .Error}}<p class="text-xs text-red-600">{{.Error}}</p>{{end}}
    <div class="flex items-center justify-end gap-2 pt-1">
      <button type="button" onclick="document.getElementById('ws-dropdown')?.remove()" class="text-xs text-gray-500 hover:text-gray-700">Cancel</button>
      <button type="submit" class="px-3 py-1 bg-indigo-600 text-white text-xs rounded hover:bg-indigo-700">Unlock</button>
    </div>
  </form>
</div>
{{end}}

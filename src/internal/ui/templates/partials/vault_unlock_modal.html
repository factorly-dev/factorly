{{define "vault_unlock_modal"}}
<div id="vault-unlock-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-xl shadow-2xl border border-gray-200 p-6 max-w-md w-full mx-4">
    <div class="flex items-start gap-3 mb-4">
      <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-600"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="flex-1">
        <h2 class="text-base font-semibold text-gray-900">Unlock your vaults</h2>
        <p class="text-sm text-gray-500 mt-0.5">{{len .Tiers}} vault{{if ne (len .Tiers) 1}}s{{end}} need unlocking before secrets can be read.</p>
      </div>
    </div>

    <ul class="mb-4 text-sm space-y-1">
      {{range .Tiers}}
      <li class="flex items-center gap-2 text-gray-600">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="font-mono text-xs">{{.Label}}</span>
      </li>
      {{end}}
    </ul>

    <form method="post" action="/vault/unlock-all"
          hx-post="/vault/unlock-all" hx-target="#vault-unlock-overlay" hx-swap="outerHTML" hx-boost="false"
          class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required autofocus placeholder="vault password"
               class="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
        <p class="text-xs text-gray-600 mt-1">We'll try this password against every locked vault.</p>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button"
                hx-post="/vault/unlock-dismiss"
                hx-target="#vault-unlock-overlay" hx-swap="outerHTML"
                hx-vals='{"_dismiss":"1"}'
                onclick="document.getElementById('vault-unlock-overlay').remove()"
                class="px-3 py-1.5 text-sm text-gray-500 hover:text-gray-700">Skip for now</button>
        <button type="submit"
                class="px-4 py-1.5 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700">Unlock</button>
      </div>
    </form>
  </div>
</div>
{{end}}

{{define "workspace_switcher"}}
<div class="absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50" id="ws-dropdown">
  <div class="px-3 py-2 text-[10px] font-semibold text-gray-400 uppercase tracking-wide border-b border-gray-100">
    Workspaces
  </div>
  {{if .Workspaces}}
  <div class="py-1 max-h-72 overflow-y-auto">
    {{range .Workspaces}}
    <form hx-post="/workspaces/switch" hx-target="#ws-dropdown" hx-swap="outerHTML" hx-include="this" class="m-0">
      <input type="hidden" name="name" value="{{.Name}}">
      <button type="submit" class="w-full px-3 py-2 text-left hover:bg-gray-50 flex items-center justify-between">
        <span class="font-mono text-xs">{{.Name}}</span>
        {{if eq .Name $.Active}}<span class="text-[10px] text-indigo-600">● active</span>{{end}}
      </button>
    </form>
    {{end}}
  </div>
  {{else}}
  <div class="px-3 py-3 text-xs text-gray-400">No workspaces defined.</div>
  {{end}}
  <div class="border-t border-gray-100 py-1">
    <a href="/workspaces" class="block px-3 py-2 text-xs text-indigo-600 hover:bg-indigo-50">Manage workspaces →</a>
  </div>
</div>
{{end}}

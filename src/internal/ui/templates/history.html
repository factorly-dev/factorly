{{define "content"}}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold">History</h1>
  <div class="flex items-center gap-2">
    <input type="text" placeholder="Filter by tool..."
           value="{{.ToolFilter}}"
           class="px-3 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-200"
           hx-get="/history"
           hx-target="body"
           hx-trigger="keyup changed delay:300ms"
           name="tool">
    <select name="status"
            class="px-3 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-200"
            hx-get="/history"
            hx-target="body"
            hx-trigger="change"
            hx-include="[name='tool'],[name='workspace']">
      <option value="">All statuses</option>
      <option value="success" {{if eq .StatusFilter "success"}}selected{{end}}>success</option>
      <option value="error" {{if eq .StatusFilter "error"}}selected{{end}}>error</option>
      <option value="blocked" {{if eq .StatusFilter "blocked"}}selected{{end}}>blocked</option>
    </select>
    <select name="workspace"
            class="px-3 py-1.5 text-xs border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-indigo-200"
            hx-get="/history"
            hx-target="body"
            hx-trigger="change"
            hx-include="[name='tool'],[name='status']">
      <option value="">All workspaces</option>
      {{range .WorkspaceOptions}}
      <option value="{{.}}" {{if eq $.WorkspaceFilter .}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </div>
</div>

{{if not .Groups}}
<div class="bg-white rounded-lg border border-gray-200 p-12 text-center text-gray-600">
  <p class="text-lg mb-2">No history yet</p>
  <p class="text-sm">Tool calls will appear here after you run them.</p>
</div>
{{else}}
<div id="history-list" class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100">
  {{range .Groups}}
    {{template "history_row" .}}
  {{end}}
</div>
<!--
  Load-more lives in its own container so the /history/more response
  can OOB-swap-replace it. When there's no nextCursor (end of log),
  the response replaces this container with an empty div and the
  button vanishes.
-->
<div id="history-more" class="mt-4 flex justify-center">
  {{if .NextCursor}}
    {{template "history_more_button" .}}
  {{end}}
</div>
{{end}}
{{end}}

<!-- `history_entry_body` lives in templates/partials/ so the dashboard
     and any other page can pull the same per-row detail body. -->

{{define "content"}}
<div class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    <h1 class="text-2xl font-bold">Activity</h1>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-green-50 text-green-700 text-xs font-medium rounded-full border border-green-200">
      <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
      live
    </span>
  </div>
  <button onclick="document.getElementById('activity-feed').innerHTML = ''"
          class="text-xs text-gray-400 hover:text-gray-600">Clear</button>
</div>

<div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
  <div class="px-5 py-2.5 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
    <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Live tool calls</span>
    <span id="activity-count" class="text-xs text-gray-400">0 calls</span>
  </div>

  <div id="activity-feed" class="divide-y divide-gray-100 max-h-[600px] overflow-y-auto">
    <div id="activity-empty" class="px-5 py-12 text-center text-gray-400 text-sm">
      <p class="mb-1">Waiting for agent activity...</p>
      <p class="text-xs">Tool calls will appear here in real-time as connected agents make them.</p>
    </div>
  </div>
</div>

<script>
(function() {
  const feed = document.getElementById('activity-feed');
  const counter = document.getElementById('activity-count');
  let count = 0;

  const evtSource = new EventSource('/activity/stream');

  evtSource.onmessage = function(event) {
    const data = JSON.parse(event.data);

    // Remove empty state
    const empty = document.getElementById('activity-empty');
    if (empty) empty.remove();

    // Build expandable row
    const row = document.createElement('details');
    row.className = 'border-b border-gray-100 last:border-b-0';

    let icon = '✓';
    let iconClass = 'bg-green-100 text-green-600';
    if (data.status === 'blocked') {
      icon = '✗';
      iconClass = 'bg-red-100 text-red-600';
    } else if (data.status === 'error') {
      icon = '!';
      iconClass = 'bg-amber-100 text-amber-600';
    }

    let shadow = '';
    if (data.shadow && data.shadow !== 'allowed') {
      shadow = `<span class="px-1.5 py-0.5 text-[10px] rounded bg-amber-50 text-amber-700">${data.shadow}</span>`;
    }

    // Build params display
    let paramsHtml = '';
    if (data.params && Object.keys(data.params).length > 0) {
      paramsHtml = '<div class="mb-2"><div class="text-[10px] text-gray-400 uppercase mb-1">Parameters</div><div class="space-y-1">';
      for (const [k, v] of Object.entries(data.params)) {
        paramsHtml += `<div><span class="text-[10px] text-gray-500 font-medium">${escapeHtml(k)}</span><pre class="text-[10px] font-mono bg-gray-50 text-gray-700 px-2 py-1 rounded mt-0.5 whitespace-pre-wrap break-all">${escapeHtml(v)}</pre></div>`;
      }
      paramsHtml += '</div></div>';
    }

    // Build output/error display
    let detailHtml = '';
    if (data.error) {
      detailHtml += `<div class="bg-red-50 rounded p-2 mb-2"><pre class="text-red-700 text-[10px] font-mono whitespace-pre-wrap">${escapeHtml(data.error)}</pre></div>`;
    }
    if (data.output) {
      detailHtml += `<div class="bg-gray-900 rounded p-2"><pre class="text-green-300 text-[10px] font-mono whitespace-pre-wrap max-h-48 overflow-y-auto">${escapeHtml(data.output)}</pre></div>`;
    }

    row.innerHTML = `
      <summary class="px-5 py-3 cursor-pointer hover:bg-gray-50 transition-colors flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-full ${iconClass} text-[10px] font-bold">${icon}</span>
          <span class="font-mono text-sm">${escapeHtml(data.tool)}</span>
          ${shadow}
        </div>
        <div class="flex items-center gap-3 text-xs text-gray-400 shrink-0">
          <span class="font-mono">${data.duration_ms}ms</span>
          <span>${data.timestamp}</span>
        </div>
      </summary>
      <div class="px-5 pb-3 pt-1 pl-12">
        ${paramsHtml}
        ${detailHtml}
        ${!paramsHtml && !detailHtml ? '<span class="text-xs text-gray-300">No additional details</span>' : ''}
      </div>
    `;

    // Prepend (newest first)
    feed.insertBefore(row, feed.firstChild);

    count++;
    counter.textContent = count + (count === 1 ? ' call' : ' calls');
  };

  evtSource.onerror = function() {
    // Will auto-reconnect
  };

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
})();
</script>
{{end}}

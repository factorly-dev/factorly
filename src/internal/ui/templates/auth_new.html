{{define "content"}}
<div class="mb-4">
  <a href="/auth" class="text-xs text-gray-500 hover:text-gray-900">← Back to Auth Providers</a>
</div>

<h1 class="text-2xl font-bold mb-2">Create OAuth Provider</h1>
<p class="text-sm text-gray-500 mb-6">
  Register an OAuth 2.0 provider. Use
  <code class="bg-gray-100 px-1 rounded">{{"{{vault:NAME}}"}}</code> references
  for the client ID / secret if you'd rather keep them in the vault
  than the YAML config.
</p>

<form method="POST" action="/auth/_new" class="bg-white rounded-lg border border-gray-200 p-5">
  <div class="space-y-3">
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Provider Name</label>
      <input type="text" name="name" required autofocus placeholder="github"
             class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Client ID</label>
        <input type="text" name="client_id" required placeholder="client id or {{"{{vault:GITHUB_CLIENT_ID}}"}}"
               class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
      </div>
      <div>
        <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Client Secret</label>
        <input type="text" name="client_secret" required placeholder="secret or {{"{{vault:GITHUB_CLIENT_SECRET}}"}}"
               class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Auth URL</label>
        <input type="text" name="auth_url" required placeholder="https://github.com/login/oauth/authorize"
               class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
      </div>
      <div>
        <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Token URL</label>
        <input type="text" name="token_url" required placeholder="https://github.com/login/oauth/access_token"
               class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
      </div>
    </div>
    <div>
      <label class="block text-[10px] font-medium text-gray-400 uppercase mb-1">Scopes</label>
      <input type="text" name="scopes" placeholder="repo, read:org (comma-separated)"
             class="w-full px-2 py-1.5 border border-gray-200 rounded text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-200">
    </div>
    <div class="flex items-center justify-end gap-2 pt-2">
      <a href="/auth" class="px-4 py-1.5 text-gray-500 text-sm hover:text-gray-700">Cancel</a>
      <button type="submit" class="px-4 py-1.5 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700">Create Provider</button>
    </div>
  </div>
</form>
{{end}}

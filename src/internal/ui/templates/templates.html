{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Templates</h1>
<p class="text-gray-600 mb-6">Pre-built tool configurations. Pick one to add to your project.</p>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  {{range .Templates}}
  <a href="/templates/{{.Name}}" class="block bg-white rounded-lg border border-gray-200 p-4 hover:border-indigo-300 hover:shadow-sm transition-all">
    <div class="font-medium text-sm">{{.DisplayName}}</div>
    <div class="text-gray-500 text-xs mt-1">{{.Description}}</div>
    <div class="flex items-center gap-2 mt-3">
      <span class="px-2 py-0.5 text-xs rounded-full bg-gray-100 text-gray-600">{{.Category}}</span>
      <span class="text-xs text-gray-400">{{.AuthType}}</span>
    </div>
  </a>
  {{end}}
</div>
{{end}}

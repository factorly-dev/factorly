{{define "content"}}
{{if not .Tools}}
<div class="bg-white rounded-lg border border-gray-200 p-12 text-center">
  <p class="text-gray-500 mb-4">No tools configured yet.</p>
  <div class="flex items-center justify-center gap-4">
    <a href="/templates" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">Browse Templates</a>
    <a href="/tools/new" class="px-4 py-2 border border-gray-200 text-sm rounded-lg hover:bg-gray-50">Create Tool</a>
  </div>
</div>
{{else}}
<div class="bg-white rounded-lg border border-gray-200 p-12 text-center text-gray-400">
  <p class="text-lg mb-2">← Select a tool</p>
  <p class="text-sm mb-4">Choose a tool from the sidebar to view its configuration and try it.</p>
  <a href="/tools/new" class="inline-flex items-center gap-1.5 px-4 py-2 border border-gray-200 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-gray-900 transition-colors">{{icon "plus"}} Create new tool</a>
</div>
{{end}}
{{end}}

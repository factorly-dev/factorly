name: intercom
display_name: Intercom
version: 1.0.0
description: Customer messaging, conversations, and support
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: bearer
auth_guide: "Get your token at https://app.intercom.com/a/apps/_/developer-hub"

requires:
  vault_keys:
    - INTERCOM_ACCESS_TOKEN

tools:
  intercom.list_conversations:
    type: rest
    description: List conversations
    base_url: "https://api.intercom.io"
    method: GET
    path: /conversations
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: per_page
        description: Number of results per page
        in: query
      - name: starting_after
        description: Cursor for pagination
        in: query

  intercom.search_contacts:
    type: rest
    description: Search for contacts
    base_url: "https://api.intercom.io"
    method: POST
    path: /contacts/search
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: query
        description: Search query object
        required: true
        in: body

  intercom.reply_conversation:
    type: rest
    description: Reply to a conversation
    base_url: "https://api.intercom.io"
    method: POST
    path: "/conversations/{conversation_id}/reply"
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: conversation_id
        description: Conversation ID
        required: true
        in: path
      - name: message_type
        description: "Type of reply (comment, note)"
        required: true
        in: body
      - name: type
        description: "Sender type (admin, user)"
        required: true
        in: body
      - name: body
        description: Reply body text
        required: true
        in: body
    shadow:
      confirm: true

  intercom.create_contact:
    type: rest
    description: Create a new contact
    base_url: "https://api.intercom.io"
    method: POST
    path: /contacts
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: role
        description: "Contact role (user, lead)"
        required: true
        in: body
      - name: email
        description: Contact email
        in: body
      - name: name
        description: Contact name
        in: body
    shadow:
      confirm: true

  intercom.list_contacts:
    type: rest
    description: List contacts
    base_url: "https://api.intercom.io"
    method: GET
    path: /contacts
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: per_page
        description: Number of results per page
        in: query
      - name: starting_after
        description: Cursor for pagination
        in: query

  intercom.get_conversation:
    type: rest
    description: Get a conversation by ID
    base_url: "https://api.intercom.io"
    method: GET
    path: "/conversations/{conversation_id}"
    auth:
      type: bearer
      token: "{{vault:INTERCOM_ACCESS_TOKEN}}"
    parameters:
      - name: conversation_id
        description: Conversation ID
        required: true
        in: path

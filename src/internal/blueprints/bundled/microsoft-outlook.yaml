name: microsoft-outlook
display_name: Microsoft Outlook
version: 1.0.0
description: Email, calendar events, and contacts
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: oauth
auth_guide: "Register an app at https://portal.azure.com/#blade/Microsoft_AAD_RegisteredApps"

requires:
  vault_keys:
    - MICROSOFT_OUTLOOK_CLIENT_ID
    - MICROSOFT_OUTLOOK_CLIENT_SECRET

oauth_providers:
  microsoft-outlook:
    client_id: "{{vault:MICROSOFT_OUTLOOK_CLIENT_ID}}"
    client_secret: "{{vault:MICROSOFT_OUTLOOK_CLIENT_SECRET}}"
    auth_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      - https://graph.microsoft.com/Mail.ReadWrite
      - https://graph.microsoft.com/Mail.Send
      - https://graph.microsoft.com/Calendars.ReadWrite

tools:
  microsoft-outlook.list_messages:
    type: rest
    description: List email messages
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: /me/messages
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: $top
        description: Number of results
        in: query
      - name: $filter
        description: OData filter expression
        in: query
      - name: $orderby
        description: Sort order (e.g. receivedDateTime desc)
        in: query
      - name: $select
        description: Fields to return
        in: query

  microsoft-outlook.send_mail:
    type: rest
    description: Send an email
    base_url: "https://graph.microsoft.com/v1.0"
    method: POST
    path: /me/sendMail
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: message
        description: "Message object (subject, body, toRecipients)"
        required: true
        in: body
      - name: saveToSentItems
        description: Save to sent items (true/false)
        in: body
    shadow:
      confirm: true

  microsoft-outlook.list_events:
    type: rest
    description: List calendar events
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: /me/events
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: $top
        description: Number of results
        in: query
      - name: $filter
        description: OData filter expression
        in: query
      - name: $orderby
        description: Sort order
        in: query

  microsoft-outlook.get_message:
    type: rest
    description: Get an email message by ID
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: "/me/messages/{message_id}"
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: message_id
        description: Message ID
        required: true
        in: path

  microsoft-outlook.create_event:
    type: rest
    description: Create a calendar event
    base_url: "https://graph.microsoft.com/v1.0"
    method: POST
    path: /me/events
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: subject
        description: Event subject
        required: true
        in: body
      - name: start
        description: "Start time object (dateTime, timeZone)"
        required: true
        in: body
      - name: end
        description: "End time object (dateTime, timeZone)"
        required: true
        in: body
      - name: attendees
        description: Array of attendee objects
        in: body
    shadow:
      confirm: true

  microsoft-outlook.search_messages:
    type: rest
    description: Search email messages
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: /me/messages
    auth:
      type: oauth
      provider: microsoft-outlook
    parameters:
      - name: $search
        description: Search query string
        required: true
        in: query
      - name: $top
        description: Number of results
        in: query

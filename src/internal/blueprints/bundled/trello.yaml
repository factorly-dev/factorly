name: trello
display_name: Trello
version: 1.0.1
description: Kanban boards, cards, and task management
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: api_key
auth_guide: |
  Trello requires BOTH an API key and a member token, sent together in
  an OAuth1-style Authorization header. Generate both at
  https://trello.com/power-ups/admin (create a Power-Up, then issue an
  API token from its credentials page).

  Store both in your vault:
    factorly vault set TRELLO_API_KEY    <your-key>
    factorly vault set TRELLO_API_TOKEN  <your-token>

requires:
  vault_keys:
    - TRELLO_API_KEY
    - TRELLO_API_TOKEN

tools:
  trello.list_cards:
    type: rest
    description: List cards on a board
    base_url: "https://api.trello.com/1"
    method: GET
    path: "/boards/{{board_id}}/cards"
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: board_id
        description: Board ID
        required: true
        in: path
      - name: filter
        description: "Filter (all, closed, none, open, visible)"
        in: query

  trello.create_card:
    type: rest
    description: Create a new card
    base_url: "https://api.trello.com/1"
    method: POST
    path: /cards
    body_type: json
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: idList
        description: List ID to add the card to
        required: true
        in: body
      - name: name
        description: Card name
        required: true
        in: body
      - name: desc
        description: Card description
        in: body
      - name: pos
        description: "Position (top, bottom, or a number)"
        in: body
    shadow:
      confirm: true

  trello.list_boards:
    type: rest
    description: List boards for the authenticated member
    base_url: "https://api.trello.com/1"
    method: GET
    path: /members/me/boards
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: filter
        description: "Filter (all, closed, members, open, starred)"
        in: query

  trello.update_card:
    type: rest
    description: Update a card
    base_url: "https://api.trello.com/1"
    method: PUT
    path: "/cards/{{card_id}}"
    body_type: json
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: card_id
        description: Card ID
        required: true
        in: path
      - name: name
        description: Card name
        in: body
      - name: desc
        description: Card description
        in: body
      - name: closed
        description: Archive card (true/false)
        in: body
    shadow:
      confirm: true

  trello.move_card:
    type: rest
    description: Move a card to a different list
    base_url: "https://api.trello.com/1"
    method: PUT
    path: "/cards/{{card_id}}"
    body_type: json
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: card_id
        description: Card ID
        required: true
        in: path
      - name: idList
        description: Target list ID
        required: true
        in: body
      - name: pos
        description: "Position in list (top, bottom)"
        in: body
    shadow:
      confirm: true

  trello.list_lists:
    type: rest
    description: List lists on a board
    base_url: "https://api.trello.com/1"
    method: GET
    path: "/boards/{{board_id}}/lists"
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: board_id
        description: Board ID
        required: true
        in: path
      - name: filter
        description: "Filter (all, closed, none, open)"
        in: query

  trello.list_labels:
    type: rest
    description: List labels defined on a board
    base_url: "https://api.trello.com/1"
    method: GET
    path: "/boards/{{board_id}}/labels"
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: board_id
        description: Board ID
        required: true
        in: path
      - name: limit
        description: "Max labels to return (default 50, max 1000)"
        in: query

  trello.update_card_labels:
    type: rest
    description: Replace the set of labels on a card with the given list of label IDs
    base_url: "https://api.trello.com/1"
    method: PUT
    path: "/cards/{{card_id}}"
    body_type: json
    auth:
      type: header
      header: Authorization
      value: 'OAuth oauth_consumer_key="{{vault:TRELLO_API_KEY}}", oauth_token="{{vault:TRELLO_API_TOKEN}}"'
    parameters:
      - name: card_id
        description: Card ID
        required: true
        in: path
      - name: idLabels
        description: "Comma-separated list of label IDs (empty string clears all labels)"
        required: true
        in: body
    shadow:
      confirm: true

name: google-docs
display_name: Google Docs
version: 1.0.0
description: Create and read Google Docs documents
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: oauth
auth_guide: "Create OAuth credentials at https://console.cloud.google.com/apis/credentials"

requires:
  vault_keys:
    - GOOGLE_DOCS_CLIENT_ID
    - GOOGLE_DOCS_CLIENT_SECRET

oauth_providers:
  google-docs:
    client_id: "{{vault:GOOGLE_DOCS_CLIENT_ID}}"
    client_secret: "{{vault:GOOGLE_DOCS_CLIENT_SECRET}}"
    auth_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/documents

tools:
  google-docs.get_document:
    type: rest
    description: Get the content and metadata of a document
    base_url: "https://docs.googleapis.com/v1"
    method: GET
    path: "/documents/{{documentId}}"
    headers:
      Content-Type: application/json
    auth:
      type: oauth
      provider: google-docs
    parameters:
      - name: documentId
        description: The document ID
        required: true
        in: path

  google-docs.create_document:
    type: rest
    description: Create a new Google Docs document
    base_url: "https://docs.googleapis.com/v1"
    method: POST
    path: /documents
    headers:
      Content-Type: application/json
    auth:
      type: oauth
      provider: google-docs
    parameters:
      - name: title
        description: Document title
        required: true
        in: body
    shadow:
      confirm: true

  google-docs.batch_update:
    type: rest
    description: Apply a batch of updates to a document
    base_url: "https://docs.googleapis.com/v1"
    method: POST
    path: "/documents/{{documentId}}:batchUpdate"
    headers:
      Content-Type: application/json
    auth:
      type: oauth
      provider: google-docs
    parameters:
      - name: documentId
        description: The document ID
        required: true
        in: path
      - name: requests
        description: Array of update request objects
        required: true
        in: body
    shadow:
      confirm: true

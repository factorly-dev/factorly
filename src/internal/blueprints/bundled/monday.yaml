name: monday
display_name: monday.com
version: 1.0.0
description: Work management, boards, and team collaboration
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: bearer
auth_guide: "Get your API token at https://YOUR_DOMAIN.monday.com/apps/manage/tokens"

requires:
  vault_keys:
    - MONDAY_API_KEY

tools:
  monday.list_items:
    type: rest
    description: List items on a board via GraphQL
    base_url: "https://api.monday.com/v2"
    method: POST
    path: ""
    auth:
      type: bearer
      token: "{{vault:MONDAY_API_KEY}}"
    parameters:
      - name: query
        description: GraphQL query to list items on a board
        required: true
        in: body

  monday.create_item:
    type: rest
    description: Create a new item on a board via GraphQL
    base_url: "https://api.monday.com/v2"
    method: POST
    path: ""
    auth:
      type: bearer
      token: "{{vault:MONDAY_API_KEY}}"
    parameters:
      - name: query
        description: "GraphQL mutation (e.g. mutation { create_item(board_id: 123, item_name: \\"
        required: true
        in: body
    shadow:
      confirm: true

  monday.list_boards:
    type: rest
    description: List boards via GraphQL
    base_url: "https://api.monday.com/v2"
    method: POST
    path: ""
    auth:
      type: bearer
      token: "{{vault:MONDAY_API_KEY}}"
    parameters:
      - name: query
        description: GraphQL query to list boards
        required: true
        in: body

  monday.update_item:
    type: rest
    description: Update an item via GraphQL
    base_url: "https://api.monday.com/v2"
    method: POST
    path: ""
    auth:
      type: bearer
      token: "{{vault:MONDAY_API_KEY}}"
    parameters:
      - name: query
        description: GraphQL mutation to update item column values
        required: true
        in: body
    shadow:
      confirm: true

  monday.search:
    type: rest
    description: Search items via GraphQL
    base_url: "https://api.monday.com/v2"
    method: POST
    path: ""
    auth:
      type: bearer
      token: "{{vault:MONDAY_API_KEY}}"
    parameters:
      - name: query
        description: GraphQL query with items_page_by_column_values or similar search
        required: true
        in: body

name: microsoft-teams
display_name: Microsoft Teams
version: 1.0.0
description: Team messaging, channels, and collaboration
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: oauth
auth_guide: "Register an app at https://portal.azure.com/#blade/Microsoft_AAD_RegisteredApps"

requires:
  vault_keys:
    - MICROSOFT_TEAMS_CLIENT_ID
    - MICROSOFT_TEAMS_CLIENT_SECRET

oauth_providers:
  microsoft-teams:
    client_id: "{{vault:MICROSOFT_TEAMS_CLIENT_ID}}"
    client_secret: "{{vault:MICROSOFT_TEAMS_CLIENT_SECRET}}"
    auth_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      - https://graph.microsoft.com/Chat.ReadWrite
      - https://graph.microsoft.com/Channel.ReadBasic.All

tools:
  microsoft-teams.send_message:
    type: rest
    description: Send a message to a channel
    base_url: "https://graph.microsoft.com/v1.0"
    method: POST
    path: "/teams/{{team_id}}/channels/{{channel_id}}/messages"
    auth:
      type: oauth
      provider: microsoft-teams
    parameters:
      - name: team_id
        description: Team ID
        required: true
        in: path
      - name: channel_id
        description: Channel ID
        required: true
        in: path
      - name: body
        description: "Message body object (content, contentType)"
        required: true
        in: body
    shadow:
      confirm: true

  microsoft-teams.list_channels:
    type: rest
    description: List channels in a team
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: "/teams/{{team_id}}/channels"
    auth:
      type: oauth
      provider: microsoft-teams
    parameters:
      - name: team_id
        description: Team ID
        required: true
        in: path

  microsoft-teams.list_teams:
    type: rest
    description: List joined teams
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: /me/joinedTeams
    auth:
      type: oauth
      provider: microsoft-teams

  microsoft-teams.list_members:
    type: rest
    description: List members of a team
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: "/teams/{{team_id}}/members"
    auth:
      type: oauth
      provider: microsoft-teams
    parameters:
      - name: team_id
        description: Team ID
        required: true
        in: path

  microsoft-teams.get_channel:
    type: rest
    description: Get a channel by ID
    base_url: "https://graph.microsoft.com/v1.0"
    method: GET
    path: "/teams/{{team_id}}/channels/{{channel_id}}"
    auth:
      type: oauth
      provider: microsoft-teams
    parameters:
      - name: team_id
        description: Team ID
        required: true
        in: path
      - name: channel_id
        description: Channel ID
        required: true
        in: path

name: zendesk
display_name: Zendesk
version: 1.0.0
description: Customer support tickets, users, and help desk
category: business
author: factorly
homepage: https://github.com/factorly-dev/factorly
license: MIT
auth_type: bearer
auth_guide: "Get your token at https://YOUR_SUBDOMAIN.zendesk.com/admin/apps-integrations/apis/zendesk-api/settings"

requires:
  vault_keys:
    - ZENDESK_API_TOKEN

tools:
  zendesk.list_tickets:
    type: rest
    description: List tickets
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: GET
    path: /tickets
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: page
        description: Page number
        in: query
      - name: per_page
        description: "Results per page (1-100)"
        in: query
      - name: sort_by
        description: "Sort field (created_at, updated_at, etc.)"
        in: query

  zendesk.create_ticket:
    type: rest
    description: Create a new ticket
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: POST
    path: /tickets
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: ticket
        description: "Ticket object with subject, description, priority, etc."
        required: true
        in: body
    shadow:
      confirm: true

  zendesk.search:
    type: rest
    description: "Search across tickets, users, and organizations"
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: GET
    path: /search
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: query
        description: Zendesk search query string
        required: true
        in: query
      - name: page
        description: Page number
        in: query
      - name: per_page
        description: Results per page
        in: query

  zendesk.update_ticket:
    type: rest
    description: Update an existing ticket
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: PUT
    path: "/tickets/{{ticket_id}}"
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: ticket_id
        description: Ticket ID
        required: true
        in: path
      - name: ticket
        description: Ticket fields to update
        required: true
        in: body
    shadow:
      confirm: true

  zendesk.get_ticket:
    type: rest
    description: Get a ticket by ID
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: GET
    path: "/tickets/{{ticket_id}}"
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: ticket_id
        description: Ticket ID
        required: true
        in: path

  zendesk.list_users:
    type: rest
    description: List users
    base_url: "https://YOUR_SUBDOMAIN.zendesk.com/api/v2"
    method: GET
    path: /users
    auth:
      type: bearer
      token: "{{vault:ZENDESK_API_TOKEN}}"
    parameters:
      - name: page
        description: Page number
        in: query
      - name: per_page
        description: Results per page
        in: query

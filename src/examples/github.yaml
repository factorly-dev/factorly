github_v3_rest_api.repos/list-activities:
    type: rest
    description: List repository activities
    parameters:
        - name: ref
          description: |-
            The Git reference for the activities you want to list.

            The `ref` for a branch can be formatted either as `refs/heads/BRANCH_NAME` or `BRANCH_NAME`, where `BRANCH_NAME` is the name of your branch.
          in: query
        - name: actor
          description: The GitHub username to use to filter by the actor who performed the activity.
          in: query
        - name: time_period
          description: |-
            The time period to filter by.

            For example, `day` will filter for activity that occurred in the past 24 hours, and `week` will filter for activity that occurred in the past 7 days (168 hours).
          in: query
        - name: activity_type
          description: |-
            The activity type to filter by.

            For example, you can choose to filter by "force_push", to see all force pushes to the repository.
          in: query
    base_url: https://api.github.com
    method: GET
    path: /repos/{{owner}}/{{repo}}/activity
github_v3_rest_api.repos/list-attestations:
    type: rest
    description: List attestations
    parameters:
        - name: subject_digest
          description: The parameter should be set to the attestation's subject's SHA256 digest, in the form `sha256:HEX_DIGEST`.
          required: true
          in: path
        - name: predicate_type
          description: |-
            Optional filter for fetching attestations with a given predicate type.
            This option accepts `provenance`, `sbom`, `release`, or freeform text
            for custom predicate types.
          in: query
    base_url: https://api.github.com
    method: GET
    path: /repos/{{owner}}/{{repo}}/attestations/{{subject_digest}}

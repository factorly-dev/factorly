    base_url: https://api.github.com
    method: GET
    path: /agents/tasks/{{task_id}}
github_v3_rest_api.agent-tasks/get-task-by-repo-and-id:
    type: rest
    description: Get a task by repo
    parameters:
        - name: owner
          description: The account owner of the repository. The name is not case sensitive.
          required: true
          in: path
        - name: repo
          description: The name of the repository. The name is not case sensitive.
          required: true
          in: path
        - name: task_id
          description: The unique identifier of the task.
          required: true
          in: path
    base_url: https://api.github.com
    method: GET
    path: /agents/repos/{{owner}}/{{repo}}/tasks/{{task_id}}
github_v3_rest_api.agent-tasks/list-tasks:
    type: rest
    description: List tasks
    parameters:
        - name: per_page
          description: The number of results per page (max 100).
          in: query
        - name: page
          description: The page number of the results to fetch.
          in: query
        - name: sort
          description: The field to sort results by. Can be `updated_at` or `created_at`.
          in: query
        - name: direction
          description: The direction to sort results. Can be `asc` or `desc`.
          in: query
        - name: state
          description: 'Comma-separated list of task states to filter by. Can be any combination of: `queued`, `in_progress`, `completed`, `failed`, `idle`, `waiting_for_user`, `timed_out`, `cancelled`.'
          in: query
        - name: is_archived
          description: Filter by archived status. When `true`, returns only archived tasks. When `false` or omitted, returns only non-archived tasks. Defaults to `false`.
          in: query
        - name: since
          description: Only show tasks updated at or after this time (ISO 8601 timestamp)
          in: query
    base_url: https://api.github.com
    method: GET
    path: /agents/tasks
github_v3_rest_api.agent-tasks/list-tasks-for-repo:
    type: rest
    description: List tasks for repository
    parameters:
        - name: owner
          description: The account owner of the repository. The name is not case sensitive.
          required: true
          in: path
        - name: repo
          description: The name of the repository. The name is not case sensitive.
          required: true
          in: path
        - name: per_page
          description: The number of results per page (max 100).
          in: query
        - name: page
          description: The page number of the results to fetch.
          in: query
        - name: sort
          description: The field to sort results by. Can be `updated_at` or `created_at`.
          in: query
        - name: direction
          description: The direction to sort results. Can be `asc` or `desc`.
          in: query
        - name: state
          description: 'Comma-separated list of task states to filter by. Can be any combination of: `queued`, `in_progress`, `completed`, `failed`, `idle`, `waiting_for_user`, `timed_out`, `cancelled`.'
          in: query
        - name: is_archived
          description: Filter by archived status. When `true`, returns only archived tasks. When `false` or omitted, returns only non-archived tasks. Defaults to `false`.
          in: query
        - name: since
          description: Only show tasks updated at or after this time (ISO 8601 timestamp)
          in: query
        - name: creator_id
          description: Filter tasks by creator user ID
          in: query
    base_url: https://api.github.com
    method: GET
    path: /agents/repos/{{owner}}/{{repo}}/tasks
